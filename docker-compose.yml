version: '3.8'

services:
  db:
    image: postgres:15
    container_name: tournament_db
    environment:
      POSTGRES_USER: tournament_user
      POSTGRES_PASSWORD: tournament_password
      POSTGRES_DB: tournament_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
    container_name: tournament_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/tournament_db
      - SPRING_DATASOURCE_USERNAME=tournament_user
      - SPRING_DATASOURCE_PASSWORD=tournament_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: tournament_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
